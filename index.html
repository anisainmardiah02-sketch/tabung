<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabung">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tabung Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EE; --surface:#FFFFFF; --ink:#12312B; --muted:#5E7770; --line:#D5E0DC;
  --accent:#E8A317; --accent-ink:#2A1D00; --danger:#C2412D; --ok:#1F7A5C;
  --glass:rgba(255,255,255,.9);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1816; --surface:#162522; --ink:#E6F2EE; --muted:#8FA9A2; --line:#25382F;
    --accent:#F0B232; --accent-ink:#2A1D00; --danger:#E5705D; --ok:#47C197; --glass:rgba(22,37,34,.92);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1816; --surface:#162522; --ink:#E6F2EE; --muted:#8FA9A2; --line:#25382F;
  --accent:#F0B232; --accent-ink:#2A1D00; --danger:#E5705D; --ok:#47C197; --glass:rgba(22,37,34,.92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;padding-bottom:96px}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px}
h1,h2,h3,.num{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Hero */
.hero{background:var(--ink);color:var(--bg);border-radius:26px;padding:20px 20px 18px;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero, :root:not([data-theme="light"]) .hero{}
.hero .lbl{font-size:14px;opacity:.75}
.hero .big{font-size:44px;font-weight:800;line-height:1.05;margin:4px 0 14px}
.hero .big small{font-size:20px;font-weight:700;opacity:.7;margin-right:4px}
.hero-row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.chip{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 12px;font-size:14px;text-align:left;color:inherit}
.chip b{display:block;font-size:16px}
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.18);margin:16px 0 8px;gap:2px}
.alloc i{display:block;height:100%}
.alloc-note{font-size:13px;opacity:.8}
.alloc-note.warn{color:#FFB4A6;opacity:1}

.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}
.sec h2{font-size:22px}
.btn{background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 16px;font-weight:600}
.btn.gold{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.full{width:100%}
.btn:active{transform:scale(.98)}

/* Tabung card */
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.jar{flex:0 0 auto;width:62px;height:78px}
.card .meta{flex:1;min-width:0}
.card .name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .amt{font-size:22px;font-weight:800}
.card .amt span{font-size:14px;font-weight:500;color:var(--muted);font-family:'DM Sans',sans-serif;letter-spacing:0}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.pct{font-weight:700;font-size:15px}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:22px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* History */
.tx{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:8px}
.tx .em{font-size:22px}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t span{font-size:13px;color:var(--muted)}
.tx .v{font-weight:700}
.tx .v.in{color:var(--ok)} .tx .v.out{color:var(--danger)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent);pointer-events:none}
.tabs{pointer-events:auto;display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:5px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);width:100%;max-width:488px}
.tabs button{flex:1;padding:10px 6px;border-radius:15px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .plus{flex:0 0 52px;background:var(--accent);color:var(--accent-ink);font-size:24px;line-height:1;font-weight:700}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.55);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet-in{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;overscroll-behavior:contain}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:24px;margin-bottom:4px}
.sheet p.help{color:var(--muted);margin:0 0 14px;font-size:14px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:17px}
.inp:focus{border-color:var(--accent);outline:none}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money .inp{padding-left:46px}
.emojis{display:flex;flex-wrap:wrap;gap:8px}
.emojis button{width:46px;height:46px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:22px}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.row2{display:flex;gap:10px;margin-top:16px}
.row2 .btn{flex:1}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-size:17px}
.sum{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.sum:last-child{border:0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;z-index:40;transition:transform .3s;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
textarea.inp{font-size:13px;min-height:90px;font-family:ui-monospace,monospace}
.hdr-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);font-size:18px;color:inherit}

.flow{margin:14px 0 4px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.fr{display:flex;justify-content:space-between;width:100%;padding:8px 0;border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent);color:inherit;text-align:left;font-size:15px}
.fr span{opacity:.8}.fr b{font-weight:600}
.fr.hl{background:color-mix(in srgb,var(--accent) 30%,transparent);margin:0 -10px;padding:8px 10px;border-radius:10px;border-bottom:0}
.fr .neg{color:#FFB4A6}
button.fr b::after{content:' ✎';opacity:.6}
.alloc{background:color-mix(in srgb,currentColor 18%,transparent)}
.hdr-btn{background:color-mix(in srgb,currentColor 14%,transparent)}
.btn.sm{padding:8px 14px;font-size:14px}
.cmbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.cm{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm.tot{background:color-mix(in srgb,var(--line) 40%,var(--surface))}
.cmt{flex:1;min-width:0;text-align:left}
.cmt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmt span{font-size:13px;color:var(--muted)}
.cv{font-weight:700;white-space:nowrap}
.chk{flex:0 0 28px;height:28px;border-radius:9px;border:2px solid var(--line);font-weight:800;color:#fff;line-height:1}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fr .neg,:root:not([data-theme="light"]) .alloc-note.warn{color:var(--danger)}}
:root[data-theme="dark"] .fr .neg,:root[data-theme="dark"] .alloc-note.warn{color:var(--danger)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabbar"><div class="tabs" role="tablist">
  <button role="tab" id="tab-home" aria-selected="true" data-act="tab" data-v="home">My tabung</button>
  <button class="plus" data-act="newTabung" aria-label="Add new tabung">+</button>
  <button role="tab" id="tab-hist" aria-selected="false" data-act="tab" data-v="hist">History</button>
</div></nav>

<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var KEY='tabung-saya-v1';
var COLORS=['#1F9D74','#E8A317','#3B82C4','#D1568A','#8B5CC8','#E4673D','#2BA7B5','#7A9A2E'];
var EMOJIS=['🏠','🚗','✈️','🎓','💍','👶','🕋','🛟','💻','🏥','🎁','📈','🛍️','🌴','🐖','🎯'];
var state={salary:0,commitments:[],tabungs:[],tx:[],lastSalary:''};
var view='home', openId=null, pickEmoji=EMOJIS[0], editingId=null;

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.tabungs)){state=Object.assign(state,d);}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rm(n){n=Number(n)||0;return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rm0(n){n=Number(n)||0;return n.toLocaleString('en-MY',{maximumFractionDigits:0})}
function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)&&n>0?Math.round(n*100)/100:0}
function monthKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthName(d){return d.toLocaleDateString('en-MY',{month:'short',year:'numeric'})}
function get(id){return state.tabungs.find(function(t){return t.id===id})}
function totalSaved(){return state.tabungs.reduce(function(a,t){return a+t.saved},0)}
function totalMonthly(){return state.tabungs.reduce(function(a,t){return a+t.monthly},0)}
function addTx(tid,type,amt,note){state.tx.unshift({id:uid(),tid:tid,type:type,amt:amt,date:new Date().toISOString(),note:note||''})}
function $(id){return document.getElementById(id)}

var toastT;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200)}

/* Jar svg */
function jar(pct,color,emoji,idx){
  var p=Math.max(0,Math.min(100,pct)),h=54,y=18+(h-h*p/100);
  var cid='c'+idx+Math.floor(Math.random()*1e6);
  return '<svg class="jar" viewBox="0 0 62 78" aria-hidden="true">'+
   '<defs><clipPath id="'+cid+'"><path d="M12 18h38a6 6 0 0 1 6 6v40a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8V24a6 6 0 0 1 6-6z"/></clipPath></defs>'+
   '<rect x="14" y="6" width="34" height="10" rx="4" fill="var(--ink)" opacity=".85"/>'+
   '<g clip-path="url(#'+cid+')"><rect x="0" y="18" width="62" height="60" fill="var(--line)" opacity=".7"/>'+
   '<rect x="0" y="'+y+'" width="62" height="'+(78-y)+'" fill="'+color+'" style="transition:y .6s"/></g>'+
   '<path d="M12 18h38a6 6 0 0 1 6 6v40a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8V24a6 6 0 0 1 6-6z" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".85"/>'+
   '<text x="31" y="53" text-anchor="middle" font-size="22">'+emoji+'</text></svg>';
}

function projection(t){
  var rem=t.target-t.saved;
  if(t.target<=0) return 'No target set';
  if(rem<=0) return 'Goal reached 🎉';
  if(t.monthly<=0) return 'Set a monthly amount to see your date';
  var m=Math.ceil(rem/t.monthly), d=new Date();d.setMonth(d.getMonth()+m);
  return m+(m===1?' month':' months')+' to go · '+monthName(d);
}

/* Render */
function render(){
  $('tab-home').setAttribute('aria-selected',view==='home');
  $('tab-hist').setAttribute('aria-selected',view==='hist');
  $('app').innerHTML=view==='home'?renderHome():renderHist();
}

function totalCommit(){return (state.commitments||[]).reduce(function(a,c){return a+c.amount},0)}
function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function renderHome(){
  var saved=totalSaved(), mo=totalMonthly(), sal=state.salary, cm=totalCommit(), av=sal-cm, free=av-mo;
  var mk=monthKey(), cms=state.commitments||[];
  function w(v){return sal>0?Math.min(100,Math.max(0,v/sal*100)):0}
  var segs=(cm>0?'<i style="width:'+w(cm)+'%;background:#8FA59E"></i>':'')+
    state.tabungs.filter(function(t){return t.monthly>0}).map(function(t){return '<i style="width:'+w(t.monthly)+'%;background:'+t.color+'"></i>'}).join('');
  var note;
  if(sal<=0) note='<div class="alloc-note">Set your monthly salary first, then add your commitments.</div>';
  else if(av<0) note='<div class="alloc-note warn">Your commitments are RM '+rm(-av)+' more than your salary.</div>';
  else if(free<0) note='<div class="alloc-note warn">Your tabung amounts are RM '+rm(-free)+' more than what is available.</div>';
  else note='<div class="alloc-note">Grey = commitments, colors = tabung, empty = left to spend.</div>';

  var h='<div class="hero"><div class="hero-row"><div><div class="lbl">Total saved</div>'+
   '<div class="big num"><small>RM</small>'+rm(saved)+'</div></div>'+
   '<button class="hdr-btn" data-act="settings" aria-label="Backup and settings">⚙️</button></div>'+
   '<div class="flow">'+
   '<button class="fr" data-act="salary"><span>Monthly salary</span><b>'+(sal>0?'RM '+rm(sal):'Set now')+'</b></button>'+
   '<div class="fr"><span>Commitments</span><b>− RM '+rm(cm)+'</b></div>'+
   '<div class="fr hl"><span>Available to save</span><b'+(av<0?' class="neg"':'')+'>RM '+rm(av)+'</b></div>'+
   '<div class="fr"><span>Into tabung</span><b>− RM '+rm(mo)+'</b></div>'+
   '<div class="fr"><span>Left to spend</span><b'+(free<0?' class="neg"':'')+'>RM '+rm(free)+'</b></div></div>'+
   '<div class="alloc" aria-hidden="true">'+segs+'</div>'+note+
   '<button class="btn gold full" style="margin-top:14px'+(state.tabungs.length?'':';opacity:.5')+'" data-act="salaryDay"'+(state.tabungs.length?'':' disabled')+'>Salary day: save now</button></div>';

  h+='<div class="sec"><h2>Monthly commitments</h2><button class="btn ghost sm" data-act="newCommit">+ Add</button></div>';
  if(!cms.length){
    h+='<div class="empty"><h3>No commitments yet</h3>Add what you pay every month: rent, car loan, insurance, phone, parents.<br><button class="btn" data-act="newCommit">Add commitment</button></div>';
  } else {
    var paidSum=0;
    h+='<div class="cmbox">'+cms.map(function(c){
      var p=c.paid===mk; if(p) paidSum+=c.amount;
      return '<div class="cm"><button class="chk" data-act="paid" data-id="'+c.id+'" aria-pressed="'+p+'" aria-label="Mark '+esc(c.name)+' as paid">'+(p?'✓':'')+'</button>'+
       '<button class="cmt" data-act="editCommit" data-id="'+c.id+'"><b>'+c.emoji+' '+esc(c.name)+'</b><span>'+(c.day?'Due on the '+ordinal(c.day):'No due date')+(p?' · Paid':'')+'</span></button>'+
       '<div class="cv">RM '+rm(c.amount)+'</div></div>';
    }).join('')+
    '<div class="cm tot"><div class="cmt"><b>Total</b><span>RM '+rm(paidSum)+' paid this month</span></div><div class="cv">RM '+rm(cm)+'</div></div></div>';
  }

  h+='<div class="sec"><h2>My tabung</h2>'+(state.tabungs.length?'<span style="color:var(--muted);font-size:14px">'+state.tabungs.length+' active</span>':'')+'</div>';
  if(!state.tabungs.length){
    h+='<div class="empty"><h3>No tabung yet</h3>Create one for each goal: emergency fund, house deposit, Umrah, car, holiday.<br><button class="btn" data-act="newTabung">Create your first tabung</button></div>';
  } else {
    state.tabungs.forEach(function(t,i){
      var pct=t.target>0?Math.min(100,t.saved/t.target*100):0;
      h+='<button class="card" data-act="open" data-id="'+t.id+'">'+jar(t.target>0?pct:(t.saved>0?35:0),t.color,t.emoji,i)+
       '<div class="meta"><div class="name">'+esc(t.name)+'</div>'+
       '<div class="amt num"><span>RM </span>'+rm(t.saved)+(t.target>0?' <span>/ '+rm0(t.target)+'</span>':'')+'</div>'+
       (t.target>0?'<div class="bar"><i style="width:'+pct+'%;background:'+t.color+'"></i></div><div class="sub"><span class="pct" style="color:'+t.color+'">'+Math.floor(pct)+'%</span> · '+esc(projection(t))+'</div>'
        :'<div class="sub" style="margin-top:6px">'+(t.monthly>0?'RM '+rm0(t.monthly)+' every month':'Free saving, no target')+'</div>')+
       '</div></button>';
    });
  }
  return h;
}

function renderHist(){
  var h='<div class="sec" style="margin-top:6px"><h2>History</h2></div>';
  if(!state.tx.length) return h+'<div class="empty"><h3>Nothing yet</h3>Every deposit and withdrawal shows up here.</div>';
  state.tx.slice(0,200).forEach(function(x){
    var t=get(x.tid), d=new Date(x.date);
    var label=x.type==='withdraw'?'Withdrawal':(x.type==='salary'?'Salary day':'Deposit');
    h+='<div class="tx"><div class="em">'+(t?t.emoji:'🗑️')+'</div><div class="t"><b>'+esc(t?t.name:'Deleted tabung')+'</b><span>'+label+' · '+d.toLocaleDateString('en-MY',{day:'numeric',month:'short'})+(x.note?' · '+esc(x.note):'')+'</span></div>'+
     '<div class="v '+(x.type==='withdraw'?'out':'in')+'">'+(x.type==='withdraw'?'−':'+')+' '+rm(x.amt)+'</div></div>';
  });
  return h;
}

/* Sheets */
function openSheet(html){$('sheetIn').innerHTML='<div class="grab"></div>'+html;$('scrim').classList.add('on');$('sheet').classList.add('on');$('sheetIn').scrollTop=0}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on');openId=null;editingId=null}

function salarySheet(){
  openSheet('<h2>Monthly salary</h2><p class="help">Your take-home pay. Commitments are taken off this first.</p>'+
   '<label class="f" for="salIn">Take-home salary per month</label><div class="money"><span>RM</span><input class="inp" id="salIn" inputmode="decimal" placeholder="0.00" value="'+(state.salary||'')+'"></div>'+
   '<div class="row2"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveSalary">Save</button></div>');
}

function formSheet(id){
  var t=id?get(id):null; editingId=id||null;
  pickEmoji=t?t.emoji:EMOJIS[state.tabungs.length%EMOJIS.length];
  openSheet('<h2>'+(t?'Edit tabung':'New tabung')+'</h2><p class="help">One tabung for one goal.</p>'+
   '<label class="f">Icon</label><div class="emojis" id="emojis">'+EMOJIS.map(function(e){return '<button type="button" data-act="emoji" data-e="'+e+'" aria-pressed="'+(e===pickEmoji)+'">'+e+'</button>'}).join('')+'</div>'+
   '<label class="f" for="fName">Name</label><input class="inp" id="fName" maxlength="28" placeholder="e.g. Emergency fund" value="'+(t?esc(t.name):'')+'">'+
   '<label class="f" for="fTarget">Target amount (optional)</label><div class="money"><span>RM</span><input class="inp" id="fTarget" inputmode="decimal" placeholder="10000" value="'+(t&&t.target?t.target:'')+'"></div>'+
   '<label class="f" for="fMonthly">Save every month</label><div class="money"><span>RM</span><input class="inp" id="fMonthly" inputmode="decimal" placeholder="500" value="'+(t&&t.monthly?t.monthly:'')+'"></div>'+
   '<div id="fHint" class="help" style="margin:6px 2px 0"></div>'+
   (t?'':'<label class="f" for="fStart">Already saved (optional)</label><div class="money"><span>RM</span><input class="inp" id="fStart" inputmode="decimal" placeholder="0.00"></div>')+
   '<div class="row2"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveTabung">Save tabung</button></div>');
  hint();
}
function hint(){
  var el=$('fHint'); if(!el) return;
  var tg=num(($('fTarget')||{}).value), mo=num(($('fMonthly')||{}).value);
  var cur=editingId?(get(editingId)||{saved:0}).saved:num(($('fStart')||{}).value);
  var s='';
  var av=state.salary-totalCommit(); if(mo>0&&av>0) s+=Math.round(mo/av*100)+'% of your available money. ';
  if(tg>0&&mo>0&&tg>cur){var m=Math.ceil((tg-cur)/mo);s+='Reaches target in about '+m+(m===1?' month':' months')+' ('+(m/12).toFixed(1)+' years).'}
  el.textContent=s;
}

function detailSheet(id){
  var t=get(id); if(!t) return; openId=id;
  var pct=t.target>0?Math.min(100,t.saved/t.target*100):0;
  var hist=state.tx.filter(function(x){return x.tid===id}).slice(0,5);
  openSheet('<div style="display:flex;gap:14px;align-items:center">'+jar(t.target>0?pct:(t.saved>0?35:0),t.color,t.emoji,99)+
   '<div><h2>'+esc(t.name)+'</h2><div class="num" style="font-size:30px;font-weight:800">RM '+rm(t.saved)+'</div></div></div>'+
   '<div class="stat"><div><span>Target</span><b>'+(t.target>0?'RM '+rm0(t.target):'None')+'</b></div>'+
   '<div><span>Monthly</span><b>'+(t.monthly>0?'RM '+rm0(t.monthly):'None')+'</b></div>'+
   '<div><span>Progress</span><b>'+(t.target>0?Math.floor(pct)+'%':'—')+'</b></div>'+
   '<div><span>Remaining</span><b>'+(t.target>0?'RM '+rm0(Math.max(0,t.target-t.saved)):'—')+'</b></div></div>'+
   '<div class="help" style="margin-bottom:4px">'+esc(projection(t))+'</div>'+
   '<label class="f" for="mvAmt">Add or withdraw</label><div class="money"><span>RM</span><input class="inp" id="mvAmt" inputmode="decimal" placeholder="0.00"></div>'+
   '<div class="row2"><button class="btn danger" data-act="withdraw">Withdraw</button><button class="btn gold" data-act="deposit">Add money</button></div>'+
   (hist.length?'<h3 style="margin:22px 0 8px;font-size:17px">Recent</h3>'+hist.map(function(x){
     return '<div class="sum"><span>'+(x.type==='withdraw'?'Withdrawal':x.type==='salary'?'Salary day':'Deposit')+' · '+new Date(x.date).toLocaleDateString('en-MY',{day:'numeric',month:'short'})+'</span><b style="color:var(--'+(x.type==='withdraw'?'danger':'ok')+')">'+(x.type==='withdraw'?'−':'+')+' '+rm(x.amt)+'</b></div>'}).join(''):'')+
   '<div class="row2" style="margin-top:22px"><button class="btn ghost" data-act="edit" data-id="'+id+'">Edit</button><button class="btn danger" data-act="del" data-id="'+id+'">Delete</button></div>');
}

var CEMOJIS=['🏠','🚗','💳','📱','💡','🛡️','👨‍👩‍👧','🎓','🍚','📺','🏥','🧾'];
function getCommit(id){return (state.commitments||[]).find(function(c){return c.id===id})}
function commitSheet(id){
  var c=id?getCommit(id):null; editingId=id||null;
  pickEmoji=c?c.emoji:CEMOJIS[0];
  openSheet('<h2>'+(c?'Edit commitment':'New commitment')+'</h2><p class="help">Something you pay every month. It is taken off your salary before saving.</p>'+
   '<label class="f">Icon</label><div class="emojis" id="emojis">'+CEMOJIS.map(function(e){return '<button type="button" data-act="emoji" data-e="'+e+'" aria-pressed="'+(e===pickEmoji)+'">'+e+'</button>'}).join('')+'</div>'+
   '<label class="f" for="cName">Name</label><input class="inp" id="cName" maxlength="28" placeholder="e.g. Car loan" value="'+(c?esc(c.name):'')+'">'+
   '<label class="f" for="cAmt">Amount every month</label><div class="money"><span>RM</span><input class="inp" id="cAmt" inputmode="decimal" placeholder="0.00" value="'+(c?c.amount:'')+'"></div>'+
   '<label class="f" for="cDay">Due day of the month (optional)</label><input class="inp" id="cDay" inputmode="numeric" maxlength="2" placeholder="e.g. 25" value="'+(c&&c.day?c.day:'')+'">'+
   '<div class="row2"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveCommit">Save commitment</button></div>'+
   (c?'<div class="row2"><button class="btn danger" data-act="delCommit" data-id="'+c.id+'">Delete commitment</button></div>':''));
}

function salaryDaySheet(){
  var items=state.tabungs.filter(function(t){return t.monthly>0});
  if(!items.length){toast('Set a monthly amount on at least one tabung');return}
  var tot=items.reduce(function(a,t){return a+t.monthly},0);
  var cm=totalCommit(), av=state.salary-cm, left=av-tot;
  var done=state.lastSalary===monthKey();
  openSheet('<h2>Salary day</h2><p class="help">'+(done?'You already saved for '+monthName(new Date())+'. Saving again will add a second round.':'Pay your commitments first, then move this month\'s amounts into your tabung.')+'</p>'+
   (state.salary>0?'<div class="sum"><span>Salary</span><b>RM '+rm(state.salary)+'</b></div>'+
    '<div class="sum"><span>Commitments</span><b>− RM '+rm(cm)+'</b></div>'+
    '<div class="sum"><span>Available to save</span><b>RM '+rm(av)+'</b></div>':'')+
   '<h3 style="margin:18px 0 4px;font-size:17px">Into your tabung</h3>'+
   items.map(function(t){return '<div class="sum"><span>'+t.emoji+' '+esc(t.name)+'</span><b>RM '+rm(t.monthly)+'</b></div>'}).join('')+
   '<div class="sum" style="font-size:18px"><b>Total</b><b class="num">RM '+rm(tot)+'</b></div>'+
   (state.salary>0?'<div class="help" style="margin-top:8px">'+(left>=0?'RM '+rm(left)+' is left to spend.':'This is RM '+rm(-left)+' more than what is available after commitments.')+'</div>':'')+
   '<div class="row2"><button class="btn ghost" data-act="close">Not yet</button><button class="btn gold" data-act="confirmSalaryDay">Save RM '+rm(tot)+'</button></div>');
}

function settingsSheet(){
  openSheet('<h2>Backup</h2><p class="help">Your data lives on this phone only. Copy the backup text and keep it in Notes, or paste an old backup to restore.</p>'+
   '<textarea class="inp" id="bk" spellcheck="false"></textarea>'+
   '<div class="row2"><button class="btn ghost" data-act="copyBk">Copy backup</button><button class="btn" data-act="restoreBk">Restore from text</button></div>'+
   '<div class="row2" style="margin-top:22px"><button class="btn danger" data-act="reset">Erase all data</button></div>');
  $('bk').value=JSON.stringify(state);
}

/* Actions */
function doMove(type){
  var inp=$('mvAmt'), a=num(inp.value), t=get(openId);
  if(!t) return;
  if(!a){toast('Enter an amount first');inp.focus();return}
  if(type==='withdraw'){
    if(a>t.saved){toast('You only have RM '+rm(t.saved)+' in this tabung');return}
    t.saved=Math.round((t.saved-a)*100)/100;
  } else t.saved=Math.round((t.saved+a)*100)/100;
  addTx(t.id,type,a); save(); render();
  var reached=type==='deposit'&&t.target>0&&t.saved>=t.target;
  detailSheet(t.id);
  toast(reached?'Goal reached! 🎉':(type==='deposit'?'Added RM '+rm(a):'Withdrew RM '+rm(a)));
}

var acts={
  tab:function(el){view=el.dataset.v;render();window.scrollTo(0,0)},
  newTabung:function(){formSheet()},
  open:function(el){detailSheet(el.dataset.id)},
  close:closeSheet,
  salary:salarySheet,
  salaryDay:salaryDaySheet,
  settings:settingsSheet,
  emoji:function(el){pickEmoji=el.dataset.e;document.querySelectorAll('#emojis button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.e===pickEmoji)})},
  saveSalary:function(){state.salary=num($('salIn').value);save();closeSheet();render();toast('Salary saved')},
  saveTabung:function(){
    var name=$('fName').value.trim();
    if(!name){toast('Give your tabung a name');$('fName').focus();return}
    var target=num($('fTarget').value), monthly=num($('fMonthly').value);
    if(editingId){var t=get(editingId);t.name=name;t.emoji=pickEmoji;t.target=target;t.monthly=monthly;toast('Tabung updated')}
    else{
      var start=num($('fStart').value);
      var nt={id:uid(),name:name,emoji:pickEmoji,color:COLORS[state.tabungs.length%COLORS.length],target:target,monthly:monthly,saved:start};
      state.tabungs.push(nt); if(start>0) addTx(nt.id,'deposit',start,'Starting balance'); toast('Tabung created');
    }
    save();closeSheet();render();
  },
  deposit:function(){doMove('deposit')},
  withdraw:function(){doMove('withdraw')},
  edit:function(el){formSheet(el.dataset.id)},
  del:function(el){
    var t=get(el.dataset.id); if(!t) return;
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tap again to delete';return}
    state.tabungs=state.tabungs.filter(function(x){return x.id!==t.id});save();closeSheet();render();toast('Tabung deleted');
  },
  newCommit:function(){commitSheet()},
  editCommit:function(el){commitSheet(el.dataset.id)},
  saveCommit:function(){
    var name=$('cName').value.trim(), amt=num($('cAmt').value), day=parseInt($('cDay').value,10);
    if(!name){toast('Give this commitment a name');$('cName').focus();return}
    if(!amt){toast('Enter the monthly amount');$('cAmt').focus();return}
    day=(day>=1&&day<=31)?day:0;
    state.commitments=state.commitments||[];
    if(editingId){var c=getCommit(editingId);c.name=name;c.emoji=pickEmoji;c.amount=amt;c.day=day;toast('Commitment updated')}
    else{state.commitments.push({id:uid(),name:name,emoji:pickEmoji,amount:amt,day:day,paid:''});toast('Commitment added')}
    save();closeSheet();render();
  },
  delCommit:function(el){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tap again to delete';return}
    state.commitments=(state.commitments||[]).filter(function(c){return c.id!==el.dataset.id});save();closeSheet();render();toast('Commitment deleted');
  },
  paid:function(el){
    var c=getCommit(el.dataset.id); if(!c) return;
    c.paid=(c.paid===monthKey())?'':monthKey(); save(); render();
  },
  confirmSalaryDay:function(){
    var tot=0;
    state.tabungs.forEach(function(t){if(t.monthly>0){t.saved=Math.round((t.saved+t.monthly)*100)/100;tot+=t.monthly;addTx(t.id,'salary',t.monthly)}});
    state.lastSalary=monthKey();save();closeSheet();render();toast('Saved RM '+rm(tot)+' 🎉');
  },
  copyBk:function(){
    var ta=$('bk');ta.select();
    try{(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value):Promise.reject()).then(function(){toast('Backup copied')},function(){document.execCommand('copy');toast('Backup copied')})}
    catch(e){try{document.execCommand('copy');toast('Backup copied')}catch(_){toast('Select the text and copy it')}}
  },
  restoreBk:function(){
    try{var d=JSON.parse($('bk').value);if(!d||!Array.isArray(d.tabungs)||!Array.isArray(d.tx))throw 0;
      state={salary:Number(d.salary)||0,commitments:Array.isArray(d.commitments)?d.commitments:[],tabungs:d.tabungs,tx:d.tx,lastSalary:d.lastSalary||''};save();closeSheet();render();toast('Backup restored')}
    catch(e){toast('That backup text is not valid')}
  },
  reset:function(el){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tap again to erase everything';return}
    state={salary:0,commitments:[],tabungs:[],tx:[],lastSalary:''};save();closeSheet();render();toast('All data erased');
  }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var f=acts[el.dataset.act]; if(f) f(el);
});
document.addEventListener('input',function(e){if(e.target.id==='fTarget'||e.target.id==='fMonthly'||e.target.id==='fStart')hint()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

load(); render();
})();
</script>
</body>
</html>
