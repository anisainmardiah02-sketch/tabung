<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabung">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tabung Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --ink:#111A3A; --muted:#62708F; --line:#DCE3F0;
  --gold:#FFC83D; --gold-ink:#3A2A00; --coral:#FF6B57; --mint:#22C99A; --violet:#7C5CFF; --peri:#8E9BFF;
  --danger:#E5483A; --ok:#0FA37A; --accent:#FFC83D; --accent-ink:#3A2A00;
  --glass:rgba(255,255,255,.93); --shadow:0 12px 28px -14px rgba(17,26,58,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F22; --surface:#141B34; --ink:#EEF1FF; --muted:#93A0C4; --line:#242E50;
    --danger:#FF7A6B; --ok:#3EDDB0; --glass:rgba(20,27,52,.94); --shadow:0 12px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F22; --surface:#141B34; --ink:#EEF1FF; --muted:#93A0C4; --line:#242E50;
  --danger:#FF7A6B; --ok:#3EDDB0; --glass:rgba(20,27,52,.94); --shadow:0 12px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:'DM Sans',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.4}
body{
  min-height:100vh;padding-bottom:128px;
  background:
    radial-gradient(520px 340px at 100% -80px,color-mix(in srgb,var(--violet) 26%,transparent),transparent 70%),
    radial-gradient(460px 320px at -12% 160px,color-mix(in srgb,var(--mint) 22%,transparent),transparent 70%),
    var(--bg);
  background-repeat:no-repeat;
}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px}
h1,h2,h3,.num{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:15px;background:var(--gold);display:grid;place-items:center;font-size:23px;box-shadow:0 3px 0 #C99A12;transform:rotate(-6deg)}
.brand b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:21px;letter-spacing:-.02em;line-height:1.05}
.brand span{font-size:12.5px;color:var(--muted)}
.gear{width:42px;height:42px;border-radius:15px;background:var(--surface);border:1px solid var(--line);font-size:18px;box-shadow:0 2px 0 var(--line)}

/* month switcher */
.msw{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.msw button{height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:24px;font-weight:700;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.msw>button:first-child,.msw>button:last-child{flex:0 0 52px}
.msw .mcur{flex:1;font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:19px;line-height:1.1}
.mcur small{display:block;font-size:11px;color:var(--ok);font-weight:600;font-family:'DM Sans',sans-serif;margin-top:2px}

/* hero wallet */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:18px 16px 16px;color:#fff;
  background:
    radial-gradient(260px 220px at 92% 0%,rgba(255,200,61,.38),transparent 70%),
    linear-gradient(155deg,#1D2C73 0%,#13204F 48%,#0D3A52 100%);
  box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:linear-gradient(45deg,transparent 47%,#FFC83D 48.5%,#FFC83D 51.5%,transparent 53%),linear-gradient(-45deg,transparent 47%,#FFC83D 48.5%,#FFC83D 51.5%,transparent 53%);
  background-size:24px 24px;
  -webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%);mask-image:linear-gradient(to bottom,#000,transparent 70%)}
.hero>*{position:relative}
.ring{position:relative;width:208px;height:208px;margin:2px auto 6px}
.ring svg{width:100%;height:100%;display:block}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 38px}
.ring .l{font-size:12.5px;opacity:.8}
.ring .rn{font-size:30px;font-weight:800;line-height:1.05;margin:2px 0}
.ring .rn small{font-size:16px;font-weight:700;opacity:.75;margin-right:3px}
.ring .rn.neg{color:#FFB4A6}
.ring .o{font-size:12px;opacity:.7}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:10px 12px;text-align:left;color:#fff;display:block;width:100%}
.tile span{display:flex;align-items:center;gap:7px;font-size:12.5px;opacity:.88}
.tile b{display:block;font-size:17px;margin-top:3px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.alloc-note{font-size:13px;opacity:.85;margin-top:12px;text-align:center}
.alloc-note.warn{color:#FFB4A6;opacity:1;font-weight:600}
.pot{display:flex;justify-content:center;margin-top:10px}
.pot span{background:rgba(255,200,61,.18);border:1px solid rgba(255,200,61,.35);color:#FFE08A;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}

/* sections & buttons */
.sec{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 12px}
.sec h2{font-size:23px;position:relative;isolation:isolate;display:inline-block}
.sec h2::after{content:"";position:absolute;left:-2px;right:-4px;bottom:1px;height:9px;background:var(--gold);opacity:.6;z-index:-1;border-radius:5px;transform:rotate(-1.2deg)}
.btn{background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 18px;font-weight:700;box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 50%,#000)}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 #C99A12}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.btn.danger{background:var(--surface);border:1.5px solid var(--danger);color:var(--danger);box-shadow:0 2px 0 color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.full{width:100%;margin-top:14px;font-size:16.5px;padding:14px}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:14px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.5}

/* tabung cards */
.card{position:relative;display:flex;gap:14px;align-items:center;width:100%;text-align:left;border-radius:28px;padding:14px;margin-bottom:12px;overflow:hidden;color:var(--ink);
  background:linear-gradient(120deg,color-mix(in srgb,var(--c,#7C5CFF) 16%,var(--surface)),var(--surface) 68%);
  border:1px solid color-mix(in srgb,var(--c,#7C5CFF) 30%,var(--line));box-shadow:var(--shadow)}
.card:active{transform:scale(.99)}
.jar{flex:0 0 auto;width:68px;height:86px;filter:drop-shadow(0 6px 8px rgba(17,26,58,.18))}
.wv{animation:wave 3.2s linear infinite}
@keyframes wave{to{transform:translateX(-62px)}}
.card .meta{flex:1;min-width:0}
.card .name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .amt{font-size:23px;font-weight:800}
.card .amt span{font-size:14px;font-weight:500;color:var(--muted);font-family:'DM Sans',sans-serif;letter-spacing:0}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:9px;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.pct{font-weight:800;font-size:12.5px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,currentColor 14%,transparent)}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:26px;padding:26px 20px;text-align:center;color:var(--muted)}
.empty::before{content:"🪙";display:block;font-size:40px;margin-bottom:4px}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* summaries / lists */
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px;margin-bottom:6px;box-shadow:var(--shadow)}
.brow{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.tx{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:11px 14px;margin-bottom:8px;color:var(--ink)}
.tx .em{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:color-mix(in srgb,var(--coral) 16%,var(--surface));display:grid;place-items:center;font-size:22px}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t span{font-size:13px;color:var(--muted)}
.tx .v{font-weight:800}
.tx .v.in{color:var(--ok)} .tx .v.out{color:var(--danger)}

.cmbox{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.cm{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm.tot{background:color-mix(in srgb,var(--peri) 14%,var(--surface))}
.cmt{flex:1;min-width:0;text-align:left}
.cmt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmt span{font-size:13px;color:var(--muted)}
.cv{font-weight:800;white-space:nowrap}
.chk{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--line);font-weight:800;color:#fff;line-height:1;background:var(--surface)}
.chk[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);box-shadow:0 0 0 4px color-mix(in srgb,var(--mint) 22%,transparent)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:10}
.tabs{pointer-events:auto;display:flex;align-items:flex-end;justify-content:space-between;width:100%;max-width:488px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:30px;padding:8px;box-shadow:0 16px 34px -14px rgba(17,26,58,.5)}
.tabs button.t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:20px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button.t svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.t[aria-selected="true"]{color:var(--ink);background:color-mix(in srgb,var(--gold) 38%,transparent)}
.tabs .plus{flex:0 0 62px;height:62px;margin:-32px 4px 0;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-size:34px;font-weight:700;line-height:1;border:4px solid var(--bg);box-shadow:0 5px 0 #C99A12,0 16px 22px -10px rgba(255,200,61,.8)}
.tabs .plus:active{transform:translateY(3px);box-shadow:0 2px 0 #C99A12}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(6,10,28,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet-in{background:var(--bg);width:100%;max-width:520px;border-radius:32px 32px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;overscroll-behavior:contain;border-top:5px solid var(--gold)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:26px;margin-bottom:4px}
.sheet p.help,.help{color:var(--muted);margin:0 0 14px;font-size:14px}
label.f{display:block;font-weight:700;font-size:14px;margin:15px 0 7px}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;font-size:17px}
.inp:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 28%,transparent)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money .inp{padding-left:48px}
.emojis,.cats{display:flex;flex-wrap:wrap;gap:8px}
.emojis button{width:48px;height:48px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:23px}
.catb{padding:10px 13px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:15px;color:var(--ink)}
.emojis button[aria-pressed="true"],.catb[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 26%,var(--surface));transform:translateY(-2px)}
.row2{display:flex;gap:10px;margin-top:18px}
.row2 .btn{flex:1}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-size:17px}
.sum{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.sum:last-child{border:0}
textarea.inp{font-size:13px;min-height:90px;font-family:ui-monospace,monospace}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;z-index:40;transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:90%;text-align:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0)}

/* motion */
#app.enter>*{animation:rise .5s cubic-bezier(.2,.9,.25,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}
#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}
#app.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.conf{position:fixed;top:-30px;pointer-events:none;z-index:60;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(560deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabbar"><div class="tabs" role="tablist">
  <button class="t" role="tab" id="tab-month" aria-selected="true" data-act="tab" data-v="month"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/></svg><span>Month</span></button>
  <button class="t" role="tab" id="tab-spend" aria-selected="false" data-act="tab" data-v="spend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3.5h13v17l-2.5-1.6-2 1.6-2-1.6-2 1.6-2-1.6-2.5 1.6z"/><path d="M9 8.5h6M9 12.5h4"/></svg><span>Spending</span></button>
  <button class="plus" data-act="newSpend" aria-label="Add a purchase">+</button>
  <button class="t" role="tab" id="tab-tabung" aria-selected="false" data-act="tab" data-v="tabung"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5h7M9.5 3.5v2.5M14.5 3.5v2.5"/><path d="M7.5 6h9a2.5 2.5 0 0 1 2.5 2.5v9A3.5 3.5 0 0 1 15.5 21h-7A3.5 3.5 0 0 1 5 17.5v-9A2.5 2.5 0 0 1 7.5 6z"/><path d="M5 12h14"/></svg><span>Tabung</span></button>
  <button class="t" role="tab" id="tab-hist" aria-selected="false" data-act="tab" data-v="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></button>
</div></nav>

<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var KEY='tabung-saya-v1';
var COLORS=['#7C5CFF','#22C99A','#FF6B57','#3BA7FF','#FF4F9A','#FFB020','#14B8C4','#8BC34A'];
var EMOJIS=['🏠','🚗','✈️','🎓','💍','👶','🕋','🛟','💻','🏥','🎁','📈','🛍️','🌴','🐖','🎯'];
var state={salary:0,salaries:{},commitments:[],expenses:[],tabungs:[],tx:[],lastSalary:''};
var view='month', vm=monthKey(), pickCat='food', openId=null, pickEmoji=EMOJIS[0], editingId=null;

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.tabungs)){state=Object.assign(state,d);}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rm(n){n=Number(n)||0;return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rm0(n){n=Number(n)||0;return n.toLocaleString('en-MY',{maximumFractionDigits:0})}
function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)&&n>0?Math.round(n*100)/100:0}
function monthKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthName(d){return d.toLocaleDateString('en-MY',{month:'short',year:'numeric'})}
function get(id){return state.tabungs.find(function(t){return t.id===id})}
function totalSaved(){return state.tabungs.reduce(function(a,t){return a+t.saved},0)}
function totalMonthly(){return state.tabungs.reduce(function(a,t){return a+t.monthly},0)}
function addTx(tid,type,amt,note){state.tx.unshift({id:uid(),tid:tid,type:type,amt:amt,date:new Date().toISOString(),note:note||''})}
function $(id){return document.getElementById(id)}

var toastT;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200)}

/* Jar svg */
function jar(pct,color,emoji,idx){
  var p=Math.max(0,Math.min(100,pct)), y=74-(54*p/100);
  var id='j'+idx+Math.floor(Math.random()*1e6);
  var JAR='M12 18h38a6 6 0 0 1 6 6v40a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8V24a6 6 0 0 1 6-6z';
  var wave='M-62 0q15.5-5 31 0t31 0t31 0t31 0t31 0t31 0t31 0t31 0V90H-62z';
  return '<svg class="jar" viewBox="0 0 62 78" aria-hidden="true">'+
   '<defs><clipPath id="c'+id+'"><path d="'+JAR+'"/></clipPath>'+
   '<linearGradient id="g'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'"/><stop offset="1" stop-color="'+color+'" stop-opacity=".72"/></linearGradient></defs>'+
   '<g clip-path="url(#c'+id+')"><rect x="0" y="18" width="62" height="60" fill="var(--surface)" opacity=".7"/>'+
   (p>0?'<g transform="translate(0 '+y.toFixed(1)+')"><path class="wv" d="'+wave+'" fill="url(#g'+id+')"/></g>':'')+'</g>'+
   '<rect x="14" y="5" width="34" height="12" rx="5.5" fill="var(--ink)" opacity=".92"/>'+
   '<rect x="24" y="9.5" width="14" height="3" rx="1.5" fill="var(--bg)"/>'+
   '<path d="'+JAR+'" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".9"/>'+
   '<path d="M13 30v22" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".5"/>'+
   '<text x="31" y="55" text-anchor="middle" font-size="22">'+emoji+'</text></svg>';
}

function projection(t){
  var rem=t.target-t.saved;
  if(t.target<=0) return 'No target set';
  if(rem<=0) return 'Goal reached 🎉';
  if(t.monthly<=0) return 'Set a monthly amount to see your date';
  var m=Math.ceil(rem/t.monthly), d=new Date();d.setMonth(d.getMonth()+m);
  return m+(m===1?' month':' months')+' to go · '+monthName(d);
}

var animNext=false;
function greeting(){var h=new Date().getHours();return h<12?'Selamat pagi':h<15?'Selamat tengah hari':h<19?'Selamat petang':'Selamat malam'}
function topbar(){
  return '<div class="top"><div class="brand"><div class="logo">🐖</div><div><b>Tabung Saya</b><span>'+greeting()+'</span></div></div>'+
   '<button class="gear" data-act="settings" aria-label="Backup and settings">⚙️</button></div>';
}
function burst(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var E=['🪙','✨','🎉','💛','🪙'];
  for(var i=0;i<28;i++){
    var s=document.createElement('span');
    s.className='conf';s.textContent=E[i%E.length];
    s.style.left=(Math.random()*94)+'vw';
    s.style.animationDelay=(Math.random()*.6)+'s';
    s.style.fontSize=(16+Math.random()*18)+'px';
    document.body.appendChild(s);
    (function(n){setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n)},2800)})(s);
  }
}
function render(){
  ['month','spend','tabung','hist'].forEach(function(v){var b=$('tab-'+v);if(b)b.setAttribute('aria-selected',view===v)});
  var a=$('app');

function pad2(n){return String(n).padStart(2,'0')}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function mkDate(mk){var p=mk.split('-');return new Date(+p[0],+p[1]-1,1)}
function mkLong(mk){return mkDate(mk).toLocaleDateString('en-MY',{month:'long',year:'numeric'})}
function shiftMk(mk,n){var d=mkDate(mk);d.setMonth(d.getMonth()+n);return monthKey(d)}
function txMonth(x){return monthKey(new Date(x.date))}
function salaryFor(mk){var s=state.salaries||{};return s[mk]!==undefined?s[mk]:state.salary}
function isPaid(c,mk){return !!(c.paidIn&&c.paidIn[mk])}
function rmS(n){return n<0?'−RM '+rm(-n):'RM '+rm(n)}
var CATS=[{k:'food',e:'🍚',n:'Food'},{k:'transport',e:'⛽',n:'Transport'},{k:'shop',e:'🛍️',n:'Shopping'},{k:'health',e:'🏥',n:'Health'},{k:'fun',e:'🎬',n:'Fun'},{k:'home',e:'🏠',n:'Household'},{k:'other',e:'🧾',n:'Other'}];
function catOf(k){return CATS.find(function(c){return c.k===k})||CATS[CATS.length-1]}
function monthExpenses(mk){return (state.expenses||[]).filter(function(e){return e.month===mk})}
function migrate(){
  state.expenses=state.expenses||[];state.salaries=state.salaries||{};
  (state.commitments||[]).forEach(function(c){c.paidIn=c.paidIn||{};if(c.paid){c.paidIn[c.paid]=true;c.paid=''}});
}
function monthStats(mk){
  var sal=salaryFor(mk), cm=totalCommit(), cur=monthKey(), planned=totalMonthly();
  var actual=0, done=false;
  state.tx.forEach(function(x){
    if(txMonth(x)!==mk||x.note==='Starting balance') return;
    if(x.type==='salary'){actual+=x.amt;done=true}
    else if(x.type==='deposit') actual+=x.amt;
  });
  var usePlanned=(mk>=cur&&!done);
  var saved=actual+(usePlanned?planned:0);
  var spent=monthExpenses(mk).reduce(function(a,e){return a+e.amt},0);
  return {sal:sal,cm:cm,saved:saved,usePlanned:usePlanned,done:done,spent:spent,left:sal-cm-saved-spent,isCur:mk===cur};
}
function monthSwitcher(){
  return '<div class="msw"><button data-act="monthPrev" aria-label="Previous month">‹</button>'+
   '<button class="mcur" data-act="monthToday">'+mkLong(vm)+(vm!==monthKey()?'<small>Tap to go to this month</small>':'')+'</button>'+
   '<button data-act="monthNext" aria-label="Next month">›</button></div>';
}

/* ---------- month overview ---------- */
function totalCommit(){return (state.commitments||[]).reduce(function(a,c){return a+c.amount},0)}
function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

function ringSvg(s){
  var R=78, C=2*Math.PI*R, sal=s.sal, used=s.cm+s.saved+s.spent, total=Math.max(sal,used);
  var svg='<svg viewBox="0 0 200 200" aria-hidden="true"><g transform="rotate(-90 100 100)"><circle cx="100" cy="100" r="'+R+'" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="22"/>';
  if(total>0){
    var segs=[[s.cm,'#8E9BFF'],[s.saved,'#FFC83D'],[s.spent,'#FF6B57'],[Math.max(0,sal-used),'#2ED3A0']], off=0;
    segs.forEach(function(g){
      var len=g[0]/total*C; if(len<=0.5) return;
      var d=Math.max(0.5,len-3);
      svg+='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="'+g[1]+'" stroke-width="22" stroke-dasharray="'+d.toFixed(2)+' '+(C-d).toFixed(2)+'" stroke-dashoffset="'+(-(off+1.5)).toFixed(2)+'"/>';
      off+=len;
    });
  }
  return svg+'</g></svg>';
}

function renderMonth(){

    sub='<div class="alloc-note">About <b>RM '+rm(s.left/days)+'</b> a day for the next '+days+(days===1?' day':' days')+'</div>';
  }

  var h=monthSwitcher()+'<div class="hero">'+
   '<div class="ring">'+ringSvg(s)+'<div class="c"><div class="l">Left to spend</div>'+
   '<div class="rn num'+(s.left<0?' neg':'')+'"><small>'+(s.left<0?'−RM':'RM')+'</small>'+rm(Math.abs(s.left))+'</div>'+

   '</div>';

  h+='<div class="sec"><h2>Monthly commitments</h2><button class="btn ghost sm" data-act="newCommit">+ Add</button></div>';
  if(!cms.length){
    h+='<div class="empty"><h3>No commitments yet</h3>Add what you pay every month: rent, car loan, insurance, phone, parents.<br><button class="btn" data-act="newCommit">Add commitment</button></div>';
  } else {
    var paidSum=0;
    h+='<div class="cmbox">'+cms.map(function(c){
      var p=isPaid(c,vm); if(p) paidSum+=c.amount;
      return '<div class="cm"><button class="chk" data-act="paid" data-id="'+c.id+'" aria-pressed="'+p+'" aria-label="Mark '+esc(c.name)+' as paid">'+(p?'✓':'')+'</button>'+
       '<button class="cmt" data-act="editCommit" data-id="'+c.id+'"><b>'+c.emoji+' '+esc(c.name)+'</b><span>'+(c.day?'Due on the '+ordinal(c.day):'No due date')+(p?' · Paid':'')+'</span></button>'+
       '<div class="cv">RM '+rm(c.amount)+'</div></div>';
    }).join('')+
    '<div class="cm tot"><div class="cmt"><b>Total</b><span>RM '+rm(paidSum)+' paid in '+mkLong(vm)+'</span></div><div class="cv">RM '+rm(s.cm)+'</div></div></div>';
  }
  return h;
}

  if(!items.length){toast('Set a monthly amount on at least one tabung');return}
  var tot=items.reduce(function(a,t){return a+t.monthly},0);
  var sal=salaryFor(monthKey()), cm=totalCommit(), av=sal-cm, left=av-tot;
  var done=monthStats(monthKey()).done;
  openSheet('<h2>Salary day</h2><p class="help">'+(done?'You already saved for '+mkLong(monthKey())+'. Saving again will add a second round.':'Pay your commitments first, then move this month\'s amounts into your tabung.')+'</p>'+
   (sal>0?'<div class="sum"><span>Salary</span><b>RM '+rm(sal)+'</b></div>'+
    '<div class="sum"><span>Commitments</span><b>− RM '+rm(cm)+'</b></div>'+
    '<div class="sum"><span>Available to save</span><b>RM '+rm(av)+'</b></div>':'')+
   '<h3 style="margin:18px 0 4px;font-size:17px">Into your tabung</h3>'+
   items.map(function(t){return '<div class="sum"><span>'+t.emoji+' '+esc(t.name)+'</span><b>RM '+rm(t.monthly)+'</b></div>'}).join('')+
   '<div class="sum" style="font-size:18px"><b>Total</b><b class="num">RM '+rm(tot)+'</b></div>'+
   (sal>0?'<div class="help" style="margin-top:8px">'+(left>=0?'RM '+rm(left)+' is left to spend.':'This is RM '+rm(-left)+' more than what is available after commitments.')+'</div>':'')+
   '<div class="row2"><button class="btn ghost" data-act="close">Not yet</button><button class="btn gold" data-act="confirmSalaryDay">Save RM '+rm(tot)+'</button></div>');
}

function settingsSheet(){
  openSheet('<h2>Backup</h2><p class="help">Your data lives on this phone only. Copy the backup text and keep it in Notes, or paste an old backup to restore.</p>'+
   '<textarea class="inp" id="bk" spellcheck="false"></textarea>'+
   '<div class="row2"><button class="btn ghost" data-act="copyBk">Copy backup</button><button class="btn" data-act="restoreBk">Restore from text</button></div>'+
   '<div class="row2" style="margin-top:22px"><button class="btn danger" data-act="reset">Erase all data</button></div>');
  $('bk').value=JSON.stringify(state);
}

/* Actions */
function doMove(type){
  var inp=$('mvAmt'), a=num(inp.value), t=get(openId);
  if(!t) return;
  if(!a){toast('Enter an amount first');inp.focus();return}
  if(type==='withdraw'){
    if(a>t.saved){toast('You only have RM '+rm(t.saved)+' in this tabung');return}
    t.saved=Math.round((t.saved-a)*100)/100;
  } else t.saved=Math.round((t.saved+a)*100)/100;
  addTx(t.id,type,a); save(); render();
  var reached=type==='deposit'&&t.target>0&&t.saved>=t.target; if(reached) burst();
  detailSheet(t.id);
  toast(reached?'Goal reached! 🎉':(type==='deposit'?'Added RM '+rm(a):'Withdrew RM '+rm(a)));
}

var acts={
  tab:function(el){view=el.dataset.v;animNext=true;render();window.scrollTo(0,0)},
  newTabung:function(){formSheet()},
  open:function(el){detailSheet(el.dataset.id)},
  close:closeSheet,
  salary:salarySheet,
  salaryDay:salaryDaySheet,
  settings:settingsSheet,
  emoji:function(el){pickEmoji=el.dataset.e;document.querySelectorAll('#emojis button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.e===pickEmoji)})},
  saveSalaryMonth:function(){state.salaries=state.salaries||{};state.salaries[vm]=num($('salIn').value);save();closeSheet();render();toast('Salary saved for '+mkLong(vm))},
  saveSalaryAll:function(){state.salary=num($('salIn').value);if(state.salaries)delete state.salaries[vm];save();closeSheet();render();toast('Salary saved')},
  monthPrev:function(){vm=shiftMk(vm,-1);animNext=true;render()},
  monthNext:function(){vm=shiftMk(vm,1);animNext=true;render()},
  monthToday:function(){vm=monthKey();animNext=true;render()},
  newSpend:function(){if(view==='tabung'||view==='hist'){view='spend';render()}spendSheet()},
  editSpend:function(el){spendSheet(el.dataset.id)},
  cat:function(el){pickCat=el.dataset.k;document.querySelectorAll('#cats button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===pickCat)})},
  saveSpend:function(){
    var a=num($('sAmt').value), note=$('sNote').value.trim(), d=$('sDate').value;
    if(!a){toast('Enter the amount');$('sAmt').focus();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) d=todayStr();
    state.expenses=state.expenses||[];
    if(editingId){var e=state.expenses.find(function(x){return x.id===editingId});if(e){e.amt=a;e.cat=pickCat;e.note=note;e.date=d;e.month=d.slice(0,7)}}
    else state.expenses.push({id:uid(),amt:a,cat:pickCat,note:note,date:d,month:d.slice(0,7)});
    vm=d.slice(0,7);save();closeSheet();render();toast('Purchase saved');
  },
  delSpend:function(el){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tap again to delete';return}
    state.expenses=(state.expenses||[]).filter(function(x){return x.id!==el.dataset.id});save();closeSheet();render();toast('Purchase deleted');
  },
  saveTabung:function(){
    var name=$('fName').value.trim();
    if(!name){toast('Give your tabung a name');$('fName').focus();return}
    var target=num($('fTarget').value), monthly=num($('fMonthly').value);
    if(editingId){var t=get(editingId);t.name=name;t.emoji=pickEmoji;t.target=target;t.monthly=monthly;toast('Tabung updated')}
    else{
      var start=num($('fStart').value);
      var nt={id:uid(),name:name,emoji:pickEmoji,color:COLORS[state.tabungs.length%COLORS.length],target:target,monthly:monthly,saved:start};
      state.tabungs.push(nt); if(start>0) addTx(nt.id,'deposit',start,'Starting balance'); toast('Tabung created');
    }
    save();closeSheet();render();
  },
  deposit:function(){doMove('deposit')},
  withdraw:function(){doMove('withdraw')},
  edit:function(el){formSheet(el.dataset.id)},
  del:function(el){
    var t=get(el.dataset.id); if(!t) return;
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tap again to delete';return}
    state.tabungs=state.tabungs.filter(function(x){return x.id!==t.id});save();closeSheet();render();toast('Tabung deleted');
  },
  newCommit:function(){commitSheet()},
  editCommit:function(el){commitSheet(el.dataset.id)},
  saveCommit:function(){
    var name=$('cName').value.trim(), amt=num($('cAmt').value), day=parseInt($('cDay').value,10);
    if(!name){toast('Give this commitment a name');$('cName').focus();return}
    if(!amt){toast('Enter the monthly amount');$('cAmt').focus();return}
    day=(day>=1&&day<=31)?day:0;
    state.commitments=state.commitments||[];
    if(editingId){var c=getCommit(editingId);c.name=name;c.emoji=pickEmoji;c.amount=amt;c.day=day;toast('Commitment updated')}
    else{state.commitments.push({id:uid(),name:name,emoji:pickEmoji,amount:amt,day:day,paid:''});toast('Commitment added')}
    save();closeSheet();render();
  },
  delCommit:function(el){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tap again to delete';return}
    state.commitments=(state.commitments||[]).filter(function(c){return c.id!==el.dataset.id});save();closeSheet();render();toast('Commitment deleted');
  },
  paid:function(el){
    var c=getCommit(el.dataset.id); if(!c) return;
    c.paidIn=c.paidIn||{}; if(c.paidIn[vm]) delete c.paidIn[vm]; else c.paidIn[vm]=true; save(); render();
  },
  confirmSalaryDay:function(){
    var tot=0;
    state.tabungs.forEach(function(t){if(t.monthly>0){t.saved=Math.round((t.saved+t.monthly)*100)/100;tot+=t.monthly;addTx(t.id,'salary',t.monthly)}});
    state.lastSalary=monthKey();save();closeSheet();render();burst();toast('Saved RM '+rm(tot)+' 🎉');
  },
  copyBk:function(){
    var ta=$('bk');ta.select();
    try{(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value):Promise.reject()).then(function(){toast('Backup copied')},function(){document.execCommand('copy');toast('Backup copied')})}
    catch(e){try{document.execCommand('copy');toast('Backup copied')}catch(_){toast('Select the text and copy it')}}
  },
  restoreBk:function(){
    try{var d=JSON.parse($('bk').value);if(!d||!Array.isArray(d.tabungs)||!Array.isArray(d.tx))throw 0;
      state={salary:Number(d.salary)||0,commitments:Array.isArray(d.commitments)?d.commitments:[],expenses:Array.isArray(d.expenses)?d.expenses:[],salaries:(d.salaries&&typeof d.salaries==='object')?d.salaries:{},tabungs:d.tabungs,tx:d.tx,lastSalary:d.lastSalary||''};migrate();save();closeSheet();render();toast('Backup restored')}
    catch(e){toast('That backup text is not valid')}
  },
  reset:function(el){
    if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tap again to erase everything';return}
    state={salary:0,salaries:{},commitments:[],expenses:[],tabungs:[],tx:[],lastSalary:''};save();closeSheet();render();toast('All data erased');
  }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var f=acts[el.dataset.act]; if(f) f(el);
});
document.addEventListener('input',function(e){if(e.target.id==='fTarget'||e.target.id==='fMonthly'||e.target.id==='fStart')hint()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

load(); migrate(); animNext=true; render();
})();
</script>
</body>
</html>
